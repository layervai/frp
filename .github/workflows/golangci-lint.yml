name: golangci-lint
on:
  push:
    branches:
    - layerv/main
  pull_request:
permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read
jobs:
  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - run: go test -race -timeout 5m ./client/...
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - name: CI contracts (Claude workflows, public-source sanitization)
      run: go test ./test/ci
    - name: Test and build web assets
      run: make web-ci
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
        version: v2.11
