name: Claude Code

# GitHub loads issue_comment workflows from the default branch, not from the
# pull request that introduces them. Commands on existing PRs therefore remain
# unavailable until this workflow is reviewed and merged to the default branch.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Edits intentionally cannot retrigger; invoke on an existing issue with a
  # new trusted @claude comment instead.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

# Future jobs inherit no token authority unless they declare it explicitly.
permissions: {}

concurrency:
  # Serialize commands for one issue or pull request so repeated comments do
  # not race duplicate terminal reviews. Never cancel an in-flight response.
  group: claude-command-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        startsWith(github.event.comment.body, '@claude') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        startsWith(github.event.review.body, '@claude') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) ||
      (
        github.event_name == 'issues' &&
        (startsWith(github.event.issue.body, '@claude') || startsWith(github.event.issue.title, '@claude')) &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Review-only by design: this multi-event job needs both write scopes to
      # reply on pull requests and issues. The token scopes themselves are
      # broader; the enforced boundary is Claude's explicit tool allowlist,
      # which exposes review comments but no GitHub close, label,
      # metadata-edit, merge, or push tool.
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Validate Claude trigger actor permission
        id: claude_actor
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ACTOR: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login || github.actor }}
        run: |
          set -euo pipefail

          if [[ -z "$TRIGGER_ACTOR" ]]; then
            echo "::error::Unable to resolve Claude trigger actor; failing closed before checkout."
            exit 1
          fi

          if ! actor_permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$TRIGGER_ACTOR/permission" --jq '.permission // ""')"; then
            echo "::error::Unable to resolve Claude trigger actor permission; failing closed before checkout."
            exit 1
          fi

          # GitHub's legacy permission field normally maps maintain to write;
          # accept maintain explicitly as defense against API representation
          # changes while continuing to reject triage/read contributors.
          case "$actor_permission" in
            admin|maintain|write) ;;
            *)
              echo "::error::Claude command trigger actor must have write access to this repository."
              exit 1
              ;;
          esac

          echo "authorized=true" >> "$GITHUB_OUTPUT"

      - name: Resolve Claude pull request context
        id: claude_pr
        if: |
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Unable to resolve pull request number for Claude command."
            exit 1
          fi

          if ! pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"; then
            echo "::error::Unable to resolve pull request head; failing closed before checkout."
            exit 1
          fi
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
          head_sha="$(jq -r '.head.sha // ""' <<<"$pr")"

          # The job carries ANTHROPIC_API_KEY and a token that can write only
          # review comments. Never checkout a fork head across that boundary.
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            if ! gh pr comment "$PR_NUMBER" --body "Claude command did not run: review commands are limited to same-repository pull requests because this workflow holds a repository secret."; then
              echo "::warning::Unable to post the fork-rejection explanation on pull request $PR_NUMBER."
            fi
            echo "::error::Claude command checkout is limited to same-repository pull requests."
            exit 1
          fi
          # GitHub uses SHA-1 today; accept the documented SHA-256 object shape
          # as well so a future repository-format migration still fails closed
          # on every other value.
          if [[ ! "$head_sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "::error::Invalid pull request head SHA: $head_sha"
            exit 1
          fi

          {
            echo "sha=$head_sha"
            echo "checkout_allowed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        id: checkout
        # Security invariant: this condition must remain implicitly
        # success()-gated. Do not add always(), failure(), or cancelled(), or a
        # failed authorization/head-resolution step could reach checkout.
        if: |
          steps.claude_actor.outputs.authorized == 'true' &&
          (
            steps.claude_pr.outcome == 'skipped' ||
            steps.claude_pr.outputs.checkout_allowed == 'true'
          )
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Review one immutable pull-request snapshot. Ordinary issue commands
          # use the default-branch event SHA.
          ref: ${{ steps.claude_pr.outputs.sha != '' && steps.claude_pr.outputs.sha || github.sha }}
          fetch-depth: 1
          # Tag mode performs its own `git fetch origin <PR branch>` after this
          # checkout. This repository is private, so retain the job token for
          # that authenticated read. contents:read keeps Git pushes impossible,
          # but the persisted job token also carries the issue/PR write scopes
          # required for replies. The explicit local-tool denylist below keeps
          # Claude on the GitHub MCP review surface and prevents it, including
          # through Task delegation, from reaching the credential in .git/config.
          persist-credentials: true

      - name: Run Claude Code
        id: claude
        # Keep the implicit success() guard here for the same fail-closed chain.
        # The pinned action restores PR-controlled startup configuration
        # (.claude/, .mcp.json, CLAUDE*.md, and related paths) from the trusted
        # base before Claude starts. Preserve that property on action upgrades.
        if: steps.checkout.outcome == 'success'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          exclude_comments_by_actor: 'claude,github-actions,*[bot]'
          # Commands are review-only. GitHub reads and inline feedback use the
          # pinned action's MCP containers, which receive the repository token
          # but not the Anthropic key. At this exact pin, tag mode creates the
          # current issue/PR tracking comment and always injects its scoped
          # update_claude_comment tool; that terminal path does not need a
          # user-allowlisted general comment tool. Deny every current local
          # execution, file, delegation, and network builtin; review commands
          # must gather context only through the explicit GitHub MCP allowlist.
          claude_args: '--model claude-opus-4-8 --disallowed-tools "Bash,Read,Glob,Grep,Task,Edit,Write,NotebookEdit,WebFetch,WebSearch" --allowed-tools "mcp__github__get_pull_request,mcp__github__get_pull_request_diff,mcp__github__get_pull_request_files,mcp__github__get_pull_request_review_comments,mcp__github__get_pull_request_reviews,mcp__github__get_pull_request_status,mcp__github__get_file_contents,mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__search_issues,mcp__github__search_pull_requests,mcp__github__list_issues,mcp__github__list_pull_requests,mcp__github_inline_comment__create_inline_comment"'
